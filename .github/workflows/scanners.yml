name: Scanners — SAST + CVE + Dockerfile lint (reusable)

# Reusable workflow volaná z repo ci.yml:
#   jobs:
#     scanners:
#       uses: matejkaraba/opinest-ci-templates/.github/workflows/scanners.yml@v1
#       secrets: inherit
#       with:
#         dockerfile-path: Dockerfile        # optional, default: Dockerfile
#         severity: "CRITICAL,HIGH"          # optional
#         semgrep-configs: "p/owasp-top-ten p/security-audit p/python p/django p/javascript p/typescript p/dockerfile"
#         build-cache: true                  # optional, GHA layer cache pre Trivy image build

on:
  workflow_call:
    inputs:
      dockerfile-path:
        type: string
        default: "Dockerfile"
        description: "Path to Dockerfile (for monorepos, e.g. backend/Dockerfile)"
      severity:
        type: string
        default: "CRITICAL"
        description: "Trivy severity filter"
      semgrep-configs:
        type: string
        default: "p/owasp-top-ten p/security-audit p/python p/django p/javascript p/typescript p/dockerfile"
        description: "Space-separated Semgrep ruleset references"
      run-container-scan:
        type: boolean
        default: true
        description: "Build image + scan with Trivy (disable for frontend-only repos)"
      build-cache:
        type: boolean
        default: false
        description: >-
          Build the scan image through buildx with the GitHub Actions layer
          cache (type=gha). Turn on for images with expensive layers (e.g.
          compiling ext-grpc takes ~25 min from scratch). Off by default:
          buildx has to export the image into the docker daemon, which
          temporarily needs extra disk, so multi-GB ML images stay on the
          plain docker build path.

jobs:
  dockerfile-lint:
    runs-on: ubuntu-latest
    name: Dockerfile lint (hadolint)
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.dockerfile-path }}
          failure-threshold: warning
          ignore: DL3008,DL3013

  sast-scan:
    runs-on: ubuntu-latest
    name: SAST (Semgrep OWASP + stack rulesets)
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: ${{ inputs.semgrep-configs }}
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  filesystem-scan:
    runs-on: ubuntu-latest
    name: Dependency CVE scan (Trivy fs)
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ inputs.severity }}
          exit-code: '1'
          ignore-unfixed: true
          format: table

  container-scan:
    runs-on: ubuntu-latest
    name: Container image CVE scan (Trivy image)
    if: ${{ inputs.run-container-scan }}
    steps:
      - uses: actions/checkout@v4
      # Ubuntu-latest runners ship with ~12 GB free. Docker images for ML
      # apps (Torch, CLIP, OpenCV) easily eat 6+ GB on top of the layer
      # cache and Trivy's image export. Clear unused tooling first so the
      # build + scan don't OOM the disk and abort with "no space left on
      # device". Frees ~25-30 GB.
      - name: Free disk space before docker build
        run: |
          set -eu
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get -y autoremove --purge >/dev/null 2>&1 || true
          sudo apt-get -y clean >/dev/null 2>&1 || true
          echo "After:"; df -h /
      - name: Build image (scan-only, not pushed)
        if: ${{ !inputs.build-cache }}
        run: docker build -t local-scan:${{ github.sha }} -f ${{ inputs.dockerfile-path }} .
      # Cached variant: same image, but layers come from the GHA cache the
      # repo's own docker-build job already fills (cache-from/cache-to
      # type=gha). Shares the cache scope with that job, so a Dockerfile that
      # did not change is not rebuilt here.
      - uses: docker/setup-buildx-action@v4
        if: ${{ inputs.build-cache }}
      - name: Build image (scan-only, GHA layer cache)
        if: ${{ inputs.build-cache }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile-path }}
          push: false
          load: true
          tags: local-scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: local-scan:${{ github.sha }}
          severity: ${{ inputs.severity }}
          exit-code: '1'
          ignore-unfixed: true
          format: table
